project_name: multimodal_model_router
input_dir: input
output_dir: output
use_mock_models: true
ocr_backend: mock
vision_understanding_backend: mock
text_analysis_backend: mock
deepseek_api_key_env: DEEPSEEK_API_KEY
deepseek_base_url: https://api.deepseek.com
deepseek_model_name: deepseek-v4-flash
deepseek_max_tokens: 2500
deepseek_compact_mode: true
text_analysis_evidence_char_limit: 6000
qwen_vl_api_key_env: DASHSCOPE_API_KEY
qwen_vl_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
qwen_vl_model_name: qwen-vl-plus
qwen_vl_max_tokens: 500
qwen_vl_max_image_side: 960
speech_to_text_backend: mock
dashscope_asr_api_key_env: DASHSCOPE_API_KEY
dashscope_asr_submit_url: https://dashscope.aliyuncs.com/api/v1/services/audio/asr/transcription
dashscope_asr_model_name: paraformer-v2
default_budget_limit_cny: 50
target_output_format: jsonl
allow_partial_success: true
