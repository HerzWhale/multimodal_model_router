runtime_backends:
  ocr:
    - mock
    - paddleocr
  vision_understanding:
    - mock
    - qwen_vl
  speech_to_text:
    - mock
    - dashscope_asr
  text_analysis:
    - mock
    - deepseek

video_preprocessing:
  default_max_keyframes: 3
  early_frame_ratio: 0.05
  audio_sample_rate_hz: 16000
  audio_channels: 1
  ffmpeg_timeout_seconds: 120
  process_error_preview_chars: 300
  keyframe_sampling_strategy: start_early_then_spaced

ocr_quality_gate:
  min_lines: 6
  max_visible_chars: 80
  min_short_line_ratio: 0.7
  min_single_char_line_ratio: 0.25
  min_ascii_noise_line_ratio: 0.4

